name: Build and Test

on:
  push:
    branches: [ main, 'topic/yacin/swank' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install DuckDB v1.4.3
        run: |
          wget https://github.com/duckdb/duckdb/releases/download/v1.4.3/libduckdb-linux-amd64.zip
          unzip libduckdb-linux-amd64.zip
          sudo mkdir -p /usr/local/lib
          sudo mv libduckdb.so /usr/local/lib/
          sudo ldconfig
          rm libduckdb-linux-amd64.zip duckdb.h duckdb.hpp

      - name: Checkout cl-duckdb
        uses: actions/checkout@v4
        with:
          repository: ak-coram/cl-duckdb
          path: cl-duckdb

      - name: Move cl-duckdb to common-lisp directory
        run: |
          mkdir -p ~/common-lisp
          mv cl-duckdb ~/common-lisp/

      - name: Setup Lisp
        uses: 40ants/setup-lisp@v4
        with:
          asdf-system: lispy-data-analysis

      - name: Install dependencies via Quicklisp
        run: |
          ros run --eval '(ql:quickload (list :cffi :swank :bordeaux-threads :clingon :alexandria :com.inuoe.jzon :cl-ascii-table :cl-spark :local-time-duration :periods :frugal-uuid))' --quit

      - name: Build binary
        run: |
          make build

      - name: Test binary
        run: |
          chmod +x ./bin/lda
          ./bin/lda --version
          ./bin/lda --help
          ./bin/lda server --help
          ./bin/lda repl --help
          ./bin/lda save --help
        # Note: We don't test actual server/repl commands here because
        # the zeek-duckdb extension is not available in CI. The binary
        # will fail gracefully with a clear error message when the
        # extension is missing at runtime.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lda-linux-amd64
          path: bin/lda

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./bin/lda
          asset_name: lda-linux-amd64
          asset_content_type: application/octet-stream
